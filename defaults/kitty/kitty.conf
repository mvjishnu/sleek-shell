# ============================================================
# SLEEK SHELL — KITTY (default; installed only if you have no kitty.conf)
# Terminal visuals and behavior
# ============================================================

# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Window
remember_window_size yes
initial_window_width 1100
initial_window_height 700
window_padding_width 12
hide_window_decorations yes
background_opacity 0.92

# Catppuccin Mocha-inspired palette
background #1e1e2e
foreground #cdd6f4
selection_background #45475a
selection_foreground #cdd6f4
cursor #cba6f7
cursor_text_color #1e1e2e
url_color #89b4fa

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

# Cursor and motion blur
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.10 0.35
cursor_trail_start_threshold 2

# Scrollback and rendering
scrollback_lines 10000
wheel_scroll_multiplier 3.0
repaint_delay 8
input_delay 3
sync_to_monitor yes

# Clipboard
copy_on_select no
strip_trailing_spaces smart

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+f5 load_config_file
map ctrl+shift+f2 edit_config_file


# Palette follows the Quickshell theme (regenerated at runtime).
include theme.conf

# Sleek Shell: font chosen in Settings > Fonts & icons
include font.conf
