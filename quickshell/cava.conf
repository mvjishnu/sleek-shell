[general]
framerate = 18
autosens = 1
sensitivity = 150
bars = 18
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 3

[input]
method = pipewire
source = auto
active = 1
remix = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 40
